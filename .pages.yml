# Pages CMS (app.pagescms.org) — beheerscherm voor Pauline (structuurplan §4.3).
# Cases en boekrecensies als formulieren (blog vervallen 19-10); tags als keuzelijst uit de centrale C-bron (src/data/cs.ts).
media:
  input: public/img
  output: /img

content:
  - name: cases
    label: Cases
    type: collection
    path: src/content/cases
    filename: "{fields.slug}.md"
    view:
      fields: [titel, klant, jaar, uitgelicht, volgorde]
    fields:
      - { name: titel, label: Titel, type: string, required: true }
      - { name: slug, label: URL-naam (kleine letters, koppeltekens), type: string, required: true }
      - { name: ondertitel, label: Ondertitel, type: string }
      - { name: klant, label: Klant / coalitie, type: string, required: true }
      - { name: jaar, label: Jaar of periode, type: string, description: "bv. 2024–2025" }
      - name: tags
        label: C's (meerdere mogelijk; Coalities staat er altijd bij)
        type: select
        list: true
        options:
          values: [Consultancy, Creatie, Communicatie, Cultuur, Change]
      - { name: uitgelicht, label: Uitgelicht op Home, type: boolean, default: false }
      - { name: volgorde, label: Volgorde (laag = eerst), type: number, default: 99 }
      - { name: hoofdbeeld, label: Beeld (onder de tekst en op de kaart), type: image }
      - { name: hoofdbeeldAlt, label: Beschrijving hoofdbeeld (alt-tekst), type: string }
      - { name: beeldBron, label: Fotocredit onder het beeld (optioneel), type: string, description: "bv. Foto: Canva" }
      - name: beelden
        label: Beeldmateriaal
        type: object
        list: true
        fields:
          - { name: src, label: Beeld, type: image }
          - { name: alt, label: Beschrijving (alt-tekst), type: string }
      - name: externeLink
        label: Externe link (optioneel)
        type: object
        fields:
          - { name: label, label: Linktekst, type: string }
          - { name: url, label: URL, type: string }
      - { name: metaOmschrijving, label: Omschrijving voor zoekmachines (1–2 zinnen), type: string }
      - { name: gepubliceerd, label: Gepubliceerd, type: date }
      - { name: bijgewerkt, label: Bijgewerkt, type: date }
      - { name: placeholder, label: Nog niet af (toont markering), type: boolean, default: false }
      - { name: body, label: Tekst (De opgave / De aanpak / Het resultaat), type: rich-text }

  - name: recensies
    label: Boekrecensies
    type: file
    path: src/data/recensies.json
    format: json
    fields:
      - name: recensies
        label: Recensies
        type: object
        list: true
        fields:
          - { name: naam, label: Naam (leeg = alleen functie tonen), type: string }
          - { name: functie, label: Functie, type: string }
          - { name: kop, label: Eerste regel (vet), type: string, required: true }
          - { name: tekst, label: Vervolg (optioneel), type: text }
          - { name: organisatie, label: Afzender is een organisatie, type: boolean, default: false }
          - { name: uitgelicht, label: Grote quote bovenaan (maximaal één), type: boolean, default: false }
