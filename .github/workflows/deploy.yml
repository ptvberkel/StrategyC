# Bouwt de Astro-site en publiceert naar GitHub Pages (structuurplan §4.3).
# Rechten minimaal; acties op vaste major-versies; lockfile in de repository (npm ci).
name: Publiceer naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PREVIEW: "1"            # testomgeving: noindex, geen CNAME. Bij livegang deze twee regels weghalen.
          PREVIEW_BASE: "/StrategyC" # project site: https://ptvberkel.github.io/StrategyC/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Na livegang: IndexNow-ping toevoegen (structuurplan §4.5).
